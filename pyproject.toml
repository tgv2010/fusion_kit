[project]
name = "fusion-kit"
version = "0.1.0"
description = "Reusable, tested building blocks for sensor fusion and computer vision."
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.15.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fusion_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
